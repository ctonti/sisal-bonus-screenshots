<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASK Sisal</title>
  
  <!-- Carica il foglio di stile dell'SDK di ask-sisal -->
  <link rel="stylesheet" href="/ask-sisal/plugins/ask-sisal/styles.css">
  
  <style>
    /* Pagina bianca pulita per ospitare il widget della chat */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .ask-sisal {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>

  <!-- Container dove viene iniettato il widget del plugin ask-sisal -->
  <div class="ask-sisal"></div>

  <!-- Carica il bundle Javascript dell'SDK di ask-sisal -->
  <script src="/ask-sisal/plugins/ask-sisal/browser.js" type="module"></script>

  <!-- Script di configurazione e inizializzazione di ask-sisal -->
  <script type="module">
    const searchParams = new URLSearchParams(window.location.search);
    const LOCAL = searchParams.has('local');

    const app = LOCAL ? {
      appKey: 'acme-default',
      apiKey: '4961c077-124e-44af-8588-57f4c3678db2',
      endpoint: 'http://localhost:3000',
    } : {
      appKey: 'ask-sisal',
      apiKey: 'zcsI_nw-r_lHznVEV5NdQ',
      endpoint: 'https://ask.websolute.ai',
    };

    document.addEventListener('DOMContentLoaded', () => {
      if ('askSisal' in window) {
        const searchParams = new URLSearchParams(window.location.search);
        const options = {
          ...app,
          styles: '/ask-sisal/plugins/ask-sisal/styles.css',
          threadId: searchParams.get('threadId'),
          contexts: [{
            title: 'Giocatore Responsabile',
            context: {
              tone: 'responsible',
            },
          }, {
            title: 'Scommettitore',
            context: {
              tone: 'bettor',
            },
          }, {
            title: 'Giocatore di Casinò',
            context: {
              tone: 'casino',
            },
          }],
          idleTime: 1000 * 60,
        };
        const instance = askSisal(options);
        const target = document.querySelector('.ask-sisal');
        const element = document.createElement('ask-sisal');
        element.style = 'display: contents;';
        target.appendChild(element);
      }
    });
  </script>

</body>
</html>
